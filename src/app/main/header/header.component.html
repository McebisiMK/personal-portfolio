<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top" (click)="closeMenu()">
      <img src="favicon.svg" width="32" height="32" alt="" />
      <span>Mcebisi Mkhohliwe</span>
    </a>
    <a class="button primary header-cv" [href]="resumeUrl" target="_blank" rel="noopener">View CV</a>
    <button
      #toggle
      class="menu-toggle"
      type="button"
      aria-controls="navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="menuOpen = !menuOpen"
    >
      {{ menuOpen ? "Close" : "Menu" }}
    </button>
    <nav id="navigation" class="site-nav" [class.open]="menuOpen" aria-label="Primary">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          [class.active]="activeId === link.id"
          [attr.aria-current]="activeId === link.id ? 'location' : null"
          (click)="selectSection(link.id)"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>
</header>
