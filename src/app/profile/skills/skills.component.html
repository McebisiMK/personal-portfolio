<section class="section" id="skill" aria-labelledby="skill-title">
  <div class="container">
    <div class="section-heading">
      <h2 id="skill-title">Skills</h2>
      <p class="skill-key"><span aria-hidden="true"></span>Core stack</p>
    </div>
    <ul class="skill-grid">
      @for (group of groups; track group.category) {
        <li class="lift">
          <div class="card skill-card">
            <h3>
              <span class="skill-icon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24"><path [attr.d]="icons[group.category]" /></svg>
              </span>
              {{ group.category }}
            </h3>
            <ul class="tags">
              @for (skill of group.skills; track skill.id) {
                <li [class.core]="skill.featured">
                  {{ skill.value }}
                  @if (skill.featured) {
                    <span class="sr-only">(core stack)</span>
                  }
                </li>
              }
            </ul>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
