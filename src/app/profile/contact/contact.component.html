<section class="section tinted" id="contact" aria-labelledby="contact-title">
  <div class="container contact-band">
    <div>
      <h2 id="contact-title">Contact</h2>
      <p>Email or call me, or connect on LinkedIn.</p>
    </div>
    <div class="contact-actions">
      @if (showContact()) {
        <span class="copy-group primary">
          <a [href]="'mailto:' + basicInformation?.email">{{ basicInformation?.email }}</a>
          <copy-button [value]="basicInformation?.email" label="email address" />
        </span>
        <span class="copy-group">
          <a [href]="basicInformation?.phone | tel">{{ basicInformation?.phone }}</a>
          <copy-button [value]="basicInformation?.phone" label="phone number" />
        </span>
      }
      <a class="button" href="https://www.linkedin.com/in/mcebisi-mkhohliwe-99362411a" target="_blank" rel="noopener">LinkedIn &#8599;</a>
    </div>
  </div>
</section>
